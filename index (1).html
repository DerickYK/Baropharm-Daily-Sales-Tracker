*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:13px;background:#F4F6F9;color:#222}
.wrap{max-width:1440px;margin:0 auto;padding:12px}

.wd-bar .badge{background:#1F3864;color:#fff;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:500}
.wd-item{display:flex;flex-direction:column;gap:1px}
.wd-item .wlbl{font-size:10px;color:#666}
.wd-item .wval{font-size:13px;font-weight:500;color:#1F3864}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.scard{background:#fff;border-radius:8px;padding:10px 12px;border:0.5px solid #DDE3EB}
.scard .lbl{font-size:11px;color:#666;margin-bottom:3px}
.scard .val{font-size:17px;font-weight:500;color:#1F3864}
.scard .sub{font-size:10px;color:#999;margin-top:2px}
.tabs{display:flex;background:#F5F7FA;border-bottom:0.5px solid #DDD;overflow-x:auto}
.tab{padding:7px 13px;font-size:12px;cursor:pointer;border:none;border-bottom:2px solid transparent;background:transparent;color:#777;font-family:inherit;white-space:nowrap}
.tab:hover{color:#333}
.tab.on{font-weight:500;color:#111}

.tab.on.t1{border-bottom-color:#1F3864}.tab.on.t2{border-bottom-color:#1F6B3E}

.tab.on.t6{border-bottom-color:#C2185B}
.panel{display:none}.panel.on{display:block}
.sec-head{padding:8px 14px;font-size:13px;font-weight:500;color:#fff;display:flex;align-items:center;gap:6px}

th.hk{background:#C2185B;color:#FCE4EC}
th.hk2{background:#AD1457;color:#fff}

.chart-box.wide{grid-column:1/-1}
.chart-title{font-size:12px;font-weight:500;color:#1F3864;margin-bottom:10px;display:flex;align-items:center;gap:6px}

    const amt=+r.a||0; if(amt<=0)return;
    const dt=new Date(r.d+'T00:00:00'); if(isNaN(dt))return;
    if(!minD||dt<minD)minD=dt; if(!maxD||dt>maxD)maxD=dt;
    total+=amt; allOrds.add(r.o); allPhs.add(r.ph);
    const keys={day:r.d,week:kbISOWeek(dt),month:r.d.slice(0,7)};
    ['day','week','month'].forEach(g=>{
      const k=keys[g];
      const b=gran[g][k]||(gran[g][k]={amt:0,ords:new Set(),phs:new Set(),dates:new Set()});
      b.amt+=amt;b.ords.add(r.o);b.phs.add(r.ph);b.dates.add(r.d);
      const pp=prod[g][r.p]||(prod[g][r.p]={});
      pp[k]=(pp[k]||0)+amt;
    });
    prodTot[r.p]=(prodTot[r.p]||0)+amt;
  });
  return{gran,prod,prodTot,total,minD,maxD,
    orders:allOrds.size,phs:allPhs.size,prodCount:Object.keys(prodTot).length};
}

// 신규 vs 재주문 (약국 기준: 약사ID의 최초 주문=신규 / 품목 기준: (약사ID,품목) 최초 구매=신규)
function kbNewRepeat(rows){
  const nz=rows.filter(r=>(+r.a||0)>0).slice().sort((a,b)=>(a.t||a.d).localeCompare(b.t||b.d));
  // 주문 단위 집계
  const ord={};   // 주문ID → {ph,t,amt,prods:Set}
  nz.forEach(r=>{
    const o=ord[r.o]||(ord[r.o]={ph:r.ph,t:r.t||r.d,amt:0,prods:new Set()});
    o.amt+=(+r.a||0); o.prods.add(r.p); if((r.t||r.d)<o.t)o.t=r.t||r.d;
  });
  const firstOrdT={};                 // 약사ID → 최초 주문시각
  Object.values(ord).forEach(o=>{ if(!(o.ph in firstOrdT)||o.t<firstOrdT[o.ph]) firstOrdT[o.ph]=o.t; });
  const ph={신규:{ord:0,amt:0,prods:new Set()},재주문:{ord:0,amt:0,prods:new Set()}};
  Object.values(ord).forEach(o=>{
    const t=(o.t===firstOrdT[o.ph])?'신규':'재주문';
    ph[t].ord++; ph[t].amt+=o.amt; o.prods.forEach(p=>ph[t].prods.add(p));
  });
  // 품목 단위(라인): (약사ID|품목) 최초 등장=신규
  const seen=new Set();
  const pr={신규:{cnt:0,amt:0},재주문:{cnt:0,amt:0}};
  nz.forEach(r=>{
    const key=r.ph+'|'+r.p;
    const t=seen.has(key)?'재주문':'신규'; seen.add(key);
    pr[t].cnt++; pr[t].amt+=(+r.a||0);
  });
  return{
    ph:{신규:{ord:ph.신규.ord,amt:ph.신규.amt,prod:ph.신규.prods.size},
        재주문:{ord:ph.재주문.ord,amt:ph.재주문.amt,prod:ph.재주문.prods.size}},
    prod:pr
  };
}

function kbSortedKeys(g,agg){return Object.keys(agg.gran[g]).sort();}
function kbLabel(g,k,agg){
  if(g==='day'){const p=k.split('-');return +p[1]+'/'+ +p[2];}
  if(g==='month'){const p=k.split('-');return p[0]+'.'+p[1];}
  const ds=[...(agg.gran.week[k]?.dates||[])].sort();
  const lbl=k.split('-W')[1]+'주';
  if(ds.length){const p=ds[0].split('-');return lbl+' ('+ +p[1]+'/'+ +p[2]+'~)';}
  return lbl;
}

// ── 워킹데이 ─────────────────────────────────────────────────
function calcWD(year,month,lastDay){
  const hl=month===8?HOLIDAYS_JUL:[];
  let tot=0,el=0;
  for(let d=1;d<=31;d++){
    try{
      const dt=new Date(year,month-1,d);
      if(dt.getMonth()!==month-1)break;
      const key=year+'-'+String(month).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      if(dt.getDay()!==0&&dt.getDay()!==6&&!hl.includes(key)){
        tot++;if(d<=lastDay)el++;
      }
    }catch(e){break;}
  }
  return{tot,elapsed:el};
}
function fm(n){
  if(n==null||isNaN(n))return '-';
  return (Math.round(n*100)/100).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function ph(a,b){
  if(!b)return '<span class="na">-</span>';
  const v=a/b*100,cls=v>=100?'g':v>=80?'':'w';
  return `<span class="${cls}">${v.toFixed(1)}%</span>`;
}
// M-1/M-2 진행율 셀: WD 진행율(WD_E/WD_T)보다 높으면 파란 배경으로 강조
function wdProgPct(){return WD_T>0?WD_E/WD_T*100:0;}
function phBG(a,b){
  if(!b)return '<td class="C"><span class="na">-</span></td>';
  const v=a/b*100, cls=v>=100?'g':v>=80?'':'w';
  const ahead=v>wdProgPct();
  const bg=ahead?' style="background:#CFE2F3!important;font-weight:600"':'';
  const tip=' title="WD 진행율 '+wdProgPct().toFixed(2)+'% '+(ahead?'초과(페이스 우위)':'이하')+'"';
  return '<td class="C"'+bg+tip+'><span class="'+cls+'">'+v.toFixed(1)+'%</span></td>';
}
function fcst(j){return WD_E>0?j/WD_E*WD_T:0;}
function svM(bv,ns){return ns.reduce((s,n)=>s+(bv[n]||0),0);}
function gskw(rows,kw,vendors){
  return rows.filter(r=>(kw?((r['상품명']||'').includes(kw)):true)&&(vendors?vendors.includes(r['도매상']):true))
    .reduce((s,r)=>s+(Number(r['실주문금액'])||0),0)/1e6;
}
function sumKws(rows,kws,vendors){return kws.reduce((s,k)=>s+gskw(rows,k,vendors),0);}
function pc(v){return v>=100?'#1F6B3E':v>=80?'#555':'#C0392B';}

function kpiCell(id,j){
  const k=KPI[id]||'',kn=parseFloat(k.replace(/,/g,''));
